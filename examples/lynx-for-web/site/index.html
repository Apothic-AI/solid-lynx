<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>solid-lynx Lynx-for-Web counter</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }

      /* `width="auto"` and `height="auto"` below hand the view's size to the
         rendered Lynx tree, so the fixture shows every section of the app and
         Playwright can click each control inside the view. */
      lynx-view {
        border: 1px solid #aaa;
      }
    </style>
    <script type="module" src="/main.ts"></script>
  </head>
  <body>
    <h1>solid-lynx Lynx-for-Web fixture</h1>
    <p>This counter is compiled as a Solid Lynx Element PAPI bundle.</p>
    <lynx-view
      id="fixture"
      url="/main.web.bundle"
      width="auto"
      height="auto"
      style="width: min(100%, 40rem)"
    ></lynx-view>
  </body>
</html>
