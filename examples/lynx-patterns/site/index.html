<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>solid-lynx patterns fixture</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }

      /* `width="auto"` and `height="auto"` hand the view's size to the rendered
         Lynx tree, so every section is laid out and Playwright can reach each
         control inside the view. */
      lynx-view {
        border: 1px solid #aaa;
      }
    </style>
    <script type="module" src="/main.ts"></script>
  </head>
  <body>
    <h1>solid-lynx patterns fixture</h1>
    <p>Forms, a keyed list, asynchronous content, and measured host capabilities.</p>
    <lynx-view
      id="fixture"
      url="/main.web.bundle"
      width="auto"
      height="auto"
      style="width: min(100%, 40rem)"
    ></lynx-view>
  </body>
</html>
