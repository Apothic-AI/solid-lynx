# Continuous integration for solid-lynx.
#
# Every step below is one of the checks `docs/building.md` and the README's
# Development section list as verified in this repository, run on the same
# commands a developer runs locally. Nothing here needs a secret.
#
# What this workflow deliberately does NOT cover: the native bundle is built
# only. No Android device (or Lynx Explorer) is attached to a CI runner, so
# native runtime behaviour — loading the bundle, rendering, tapping, the
# [solid-lynx parity] report — is still verified by hand as described in
# docs/building.md.
#
# What it does enforce about native work is evidence: `native-evidence` runs
# scripts/require-native-evidence.mjs over a pull request's diff, and a change
# to native-facing code without either a committed, verifier-passing capture
# under docs/evidence/native/ or an explicit recorded decision is red. The
# device run the capture comes from is still manual; the requirement that one
# exists is not.
#
# Version coverage is two axes. `node-matrix` exercises the declared
# `engines.node` range at the top of each Node line it admits. `solid-matrix`
# exercises the declared `peerDependencies.solid-js` range at its top, by
# installing the newest admitted Solid and its matching compiler over the pinned
# set before running the gate. Both have a comment above them explaining what
# they do and do not prove.

name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# A new push to the same PR or branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep pnpm quiet and non-interactive in CI.
  CI: "true"

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Type check consumer fixtures
        run: pnpm typecheck:consumer

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package contents
        run: pnpm pack --dry-run

  # Exercises the declared `engines.node` range (`^20.19.0 || >=22.12.0`,
  # package.json) instead of only the single Node 22 the other jobs use.
  #
  # Why these three entries:
  #   - `20.x` is the lower declared line; it resolves to the newest 20, which is
  #     >= 20.19.0 and so inside the range.
  #   - `22.x` is the upper declared line; it resolves to the newest 22, which is
  #     >= 22.12.0 and so inside the range.
  #   - `24.x` is inside the range because `>=22.12.0` is open-ended, and nothing
  #     in this graph forbids it: no manifest in the installed tree declares an
  #     upper bound on `engines.node`, and the pinned pnpm 12.9.1 declares `>=18`.
  # The `N.x` specifiers resolve to the newest release on each line, so this
  # proves line tops (20.20.2, 22.23.x, 24.x at the time of writing) and does not
  # prove the `20.19.0` / `22.12.0` floors. Node 21/23/25, future majors, and
  # non-Linux hosts are not covered.
  #
  # This is the Node axis only. The Solid axis is `solid-matrix` below, which
  # installs a different Solid over the pins instead of using a matrix axis —
  # this repository resolves exactly one Solid through `babel-preset-solid`, so a
  # second Solid is a dependency swap, not a Node version. `@lynx-js/web-core`
  # has no leg at all: one supported version (0.26.2), not a matrix dimension.
  #
  # Deliberately not `needs: unit`: a red leg here should read as the matrix
  # failing, not as the unit gate failing.
  node-matrix:
    name: node-matrix (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Let every leg finish so one broken Node version does not hide the others.
      fail-fast: false
      matrix:
        node: ["20.x", "22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  # Exercises the declared `peerDependencies.solid-js` range (`^1.9.15`,
  # package.json) instead of only the pinned 1.9.15 every other job resolves.
  # `^1.9.15` admits exactly three published versions — 1.9.15, 1.9.16 and
  # 1.9.17 — and only the first has ever been installed here. This job installs
  # the other two over the pins and runs the gate on each, so the peer promise
  # has runs behind it rather than a declaration.
  #
  # `babel-preset-solid` moves with it. It is this package's compile path
  # (`docs/compatibility.md` §2) and each release declares a peer on the Solid it
  # was built against — 1.9.15 and 1.9.16 both declare `^1.9.15` and `^1.9.16`
  # respectively — so overriding the runtime alone would test a combination no
  # consumer can install. The matrix pairs them; 1.9.17 has no preset of its own,
  # so it runs on 1.9.16, which is what a consumer on 1.9.17 resolves today.
  #
  # Mechanism: `overrides` in pnpm-workspace.yaml, written here rather than
  # committed. Not `pnpm add`: `pnpm add -D --no-save` does not exist in the
  # pinned pnpm 12.9.1 (it errors with "unexpected argument '--no-save'"), and a
  # committed `overrides` entry would override the pins for every consumer of
  # this repository. Not `pnpm add -D -E` either, which was tried and does not
  # work: `pnpm add` rewrites package.json and pnpm-lock.yaml, and restoring
  # those with `git checkout` makes pnpm's implicit pre-script install resync
  # `node_modules` back to the committed pins, so `pnpm typecheck` silently ran
  # 1.9.15 under a job labelled 1.9.17. An override in pnpm-workspace.yaml is
  # part of pnpm's own configuration, so the pre-script sync keeps it — checked:
  # with the committed pnpm-lock.yaml restored mid-run, the gate still ran with
  # 1.9.17 installed.
  #
  # Why `--no-frozen-lockfile` here and nowhere else: an override is a resolution
  # the committed lockfile does not contain, so pnpm must re-resolve, and a frozen
  # install refuses to. This is acceptable on this job only because nothing in it
  # is authoritative: `unit` and `node-matrix` run the same gate against the
  # committed lockfile with `--frozen-lockfile`, and `needs: unit` means this job
  # only runs after they are green. What this job proves is the Solid range; that
  # the committed lockfile is consistent stays `unit`'s job. The re-resolve is
  # also wide — overriding one package rewrites the peer-resolution suffixes of
  # many unrelated entries — which is a second reason its lockfile is scaffolding.
  # The lockfile is therefore never committed from here, and a later step fails
  # the job if it is dirty.
  #
  # The re-resolved lockfile is deliberately left in place for the gate rather
  # than reverted first. Reverting it while the override is still active leaves
  # pnpm's implicit pre-script install with a lockfile whose `overrides` block
  # does not match the config, and it reports ERR_PNPM_LOCKFILE_CONFIG_MISMATCH on
  # every `pnpm <script>` — a warning in pnpm 12.9.1, but a fragile place to
  # depend on, and one that would fail outright under a stricter pnpm. Keeping the
  # matching lockfile means the pre-script install is a no-op and the gate runs
  # only because the override says so.
  #
  # The two assertions after the gate are the guard against a repeat of the
  # silent-downgrade bug above: if a future pnpm or a changed step order lets the
  # gate run on the pins, the job fails naming the version it expected instead of
  # passing under the wrong name.
  #
  # `pnpm web:build` is not padding. `babel-preset-solid` only runs inside a real
  # Rspack build — `pnpm typecheck` and `pnpm test` name the preset in string
  # assertions but never load it, verified by replacing the installed preset with
  # one that throws: both still exited 0, while `web:build` failed on it. A Solid
  # bump that type-checks but compiles badly would be invisible to the other two
  # steps, so the compile is part of this job.
  #
  # Locally, on Node 22.23.3 / pnpm 12.9.1, both legs exited 0 on every step
  # below: `pnpm typecheck`, `pnpm test` (121 tests, 7 files at that commit;
  # the suite has since grown, and `test/documented-counts.test.ts` is what keeps
  # the current figure honest), `pnpm web:build`.
  # See `docs/compatibility.md` §2 for the recorded runs.
  solid-matrix:
    name: solid-matrix (solid ${{ matrix.solid }}, preset ${{ matrix.preset }})
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Both legs finish so one broken Solid does not hide the other.
      fail-fast: false
      matrix:
        # Every published version `^1.9.15` admits above the 1.9.15 pin, with
        # the `babel-preset-solid` a consumer on that Solid resolves. Bumping the
        # peer range means editing this list and package.json together.
        include:
          - solid: "1.9.16"
            preset: "1.9.16"
          - solid: "1.9.17"
            preset: "1.9.16"
    env:
      # Read by the steps below; also what the assertions compare against.
      SOLID_VERSION: ${{ matrix.solid }}
      PRESET_VERSION: ${{ matrix.preset }}
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Same starting point as every other job: the committed pins.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Uncommitted override, in this working directory only.
      - name: Overlay Solid ${{ matrix.solid }}
        run: |
          printf '\noverrides:\n  solid-js: %s\n  babel-preset-solid: %s\n' \
            "$SOLID_VERSION" "$PRESET_VERSION" >> pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile

      # Nothing has run the gate yet, so first prove the install actually
      # overlaid rather than silently keeping the pins.
      - name: Confirm the overlay installed
        run: |
          test "$(node -p "require('solid-js/package.json').version")" = "$SOLID_VERSION"
          test "$(node -p "require('babel-preset-solid/package.json').version")" = "$PRESET_VERSION"

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # The only step that executes `babel-preset-solid`. See the note above.
      - name: Build the web bundle
        run: pnpm web:build

      # The gate must have run on the overlay, not on the pins — this is the
      # assertion that a mid-run resync would break.
      - name: Assert the gate ran on the overlay
        run: |
          test "$(node -p "require('solid-js/package.json').version")" = "$SOLID_VERSION"
          test "$(node -p "require('babel-preset-solid/package.json').version")" = "$PRESET_VERSION"

      # Every committed manifest is restored and then proved untouched: this
      # mechanism changes only the override it appended to pnpm-workspace.yaml and
      # the lockfile pnpm re-resolved from it. Each matrix leg gets a fresh
      # checkout on GitHub, so this is belt and braces there; it is what lets the
      # same job be replayed locally leg after leg.
      - name: Restore and check the committed manifests
        run: |
          git checkout -- package.json pnpm-lock.yaml pnpm-workspace.yaml
          test -z "$(git status --porcelain -- package.json pnpm-lock.yaml pnpm-workspace.yaml)"

  browser:
    name: browser
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Builds the web bundle, serves it, and drives it in Chromium.
      - name: Lynx-for-Web suite
        run: PLAYWRIGHT_PORT=4186 pnpm web:test

      # Separate suite and config: builds and serves examples/lynx-patterns.
      - name: Pattern suite
        run: PLAYWRIGHT_PORT=4200 pnpm exec playwright test --config test/browser/patterns.playwright.config.ts

      - name: Upload Playwright report
        if: failure()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Build-only: proves the native bundle compiles. No device runs in CI, so
  # native runtime behaviour (bundle loading, rendering, taps, parity report)
  # is NOT covered here — see docs/building.md "Native".
  native-build:
    name: native-build
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the native bundle
        run: pnpm native:build

      - name: Upload native bundle
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: lynx-for-native-dist
          path: examples/lynx-for-native/dist
          if-no-files-found: error
          retention-days: 7

  # The native evidence requirement, as a check rather than a convention.
  #
  # `scripts/require-native-evidence.mjs` reads the pull request's diff and
  # answers one question: did this change touch native-facing behaviour, and if
  # so is there a committed record that satisfies the requirement? A capture
  # under `docs/evidence/native/<id>/` with a `manifest.json` is re-verified here
  # by the verifier its `card` selects — `scripts/verify-native-parity.mjs` for
  # the smoke card's one `[solid-lynx parity]` report,
  # `scripts/verify-native-probe.mjs` for the stylesheet and list cards' one line
  # per stage. A `decision.json` is an explicit recorded decision that this change
  # needs no device run. A native-facing change with neither is a red job.
  #
  # A third form exists and is deliberately NOT a pass: `pending.json`, written
  # when the run is specified and blocked on hardware. The script exits 3 for it,
  # and the step below turns 3 into a workflow warning annotation plus a job
  # summary line instead of a failure. That split is the point: exit 1 and 2 still
  # fail this job, so a red `native-evidence` job always means the evidence is
  # missing or unreadable, never merely scheduled. A reader who only looks at the
  # green tick on a pending run is looking at the one thing this arrangement
  # cannot fix — GitHub has no neutral job conclusion — which is why the warning
  # names itself "pending, not a pass" and repeats in the summary.
  #
  # What this job still cannot do: attach a device. `native-build` compiles the
  # bundle and executes nothing, and this job reads files. So the device run
  # itself stays manual (`docs/release.md` §3) — what is enforced is that a
  # native-facing change cannot land without either a stored, verifier-passing
  # capture, an explicit recorded decision, or an explicit recorded pending run.
  #
  # The range is the PR base sha..HEAD, so the gate covers exactly what the pull
  # request changes. On `push` and `workflow_dispatch` there is no PR base, and
  # the job says so and passes instead of inventing a base: a gate that silently
  # evaluated `HEAD..HEAD` would report "nothing to require" for every push and
  # look green for the wrong reason.
  #
  # `pnpm build` runs first because the verifier reads its checklist from
  # `dist/parity.js` and exits 2 without it; without the build, every capture
  # would come back "could not evaluate" instead of a verdict.
  native-evidence:
    name: native-evidence
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base and the PR base sha both need real history, and the
          # verifier's `commit` check walks from the base to HEAD.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The verifier imports `parityOperationIds` from the built package.
      - name: Build
        run: pnpm build

      # A pull request: evaluate exactly the diff it proposes.
      #
      # Exit 0 is a pass, 1 is missing evidence, 2 is could not evaluate, and 3 is
      # pending-and-not-a-pass. 0 and 3 end the step green (3 with a warning
      # annotation and a summary block); 1 and 2 exit with their own code and fail
      # the job. The explicit `set +e` is required because this shell runs with
      # `-e -o pipefail`, so a 3 would otherwise abort before it was classified.
      - name: Require native evidence for this pull request
        if: github.event_name == 'pull_request'
        run: |
          set +e
          node scripts/require-native-evidence.mjs \
            --range "${{ github.event.pull_request.base.sha }}..HEAD" 2>&1 \
            | tee native-evidence.log
          status="${PIPESTATUS[0]}"
          set -e

          # Workflow-command payloads are single-line: % -> %25, CR dropped,
          # LF -> %0A. The full report goes to the log and the step summary; the
          # annotation carries only the lines that say what is wrong.
          annotate() {
            tr -d '\r' | sed -e 's/%/%25/g'
          }

          case "$status" in
            0)
              {
                echo "### Native evidence: satisfied"
                echo
                echo '```'
                cat native-evidence.log
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            3)
              # Pending, not a pass. The annotation names the verdict and the
              # blocker; the summary carries the whole warning block, including
              # every path, so the detail is one click away and nothing is
              # silently dropped.
              summary=$(grep -E '^verdict: ' native-evidence.log | head -1 | annotate)
              blocker=$(grep -E '^!! Blocker:' native-evidence.log | head -1 | sed 's/^!! Blocker: *//' | annotate)
              count=$(grep -cE '^!!   - ' native-evidence.log)
              message="${summary}%0A%0A${count} native-facing path(s) are covered only by a pending record. Blocker: ${blocker}%0A%0ASee the job summary or native-evidence.log for every path. This is exit 3, not 0: nothing was verified as a pass."
              echo "::warning title=Native evidence PENDING — not a pass::${message}"
              {
                echo "### Native evidence: **pending, not a pass**"
                echo
                echo 'This job is green because every native-facing path is covered by a'
                echo 'committed `pending.json` — not because anything was measured. No'
                echo 'native behaviour in this pull request has been verified.'
                echo
                echo '```'
                cat native-evidence.log
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            *)
              echo "::error title=Native evidence MISSING::require-native-evidence exited $status: nothing satisfies the requirement. See the step log or native-evidence.log."
              {
                echo "### Native evidence: **missing** (exit $status)"
                echo
                echo '```'
                cat native-evidence.log
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit "$status"
              ;;
          esac

      # No PR base: there is nothing to compare against, so say that out loud
      # rather than passing a range that cannot mean anything.
      - name: No pull request base — nothing to require
        if: github.event_name != 'pull_request'
        run: |
          echo "Not a pull request (${{ github.event_name }}), so there is no base to"
          echo "diff against and no range this gate can evaluate. Skipping: the"
          echo "requirement is checked on pull_request, where a base sha exists."
          echo "This is a no-op pass, not a native result."
